name: GitHub Pages

on:
  push:
    branches:
      - blog-src
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: .cache/images
          key: images-${{ hashFiles('content/images/**', 'scripts/prepare-image.py') }}
          restore-keys: images-

      - name: Cache drawn figures
        uses: actions/cache@v4
        with:
          path: |
            .cache/figures
            .cache/math
            .cache/vendor
          key: figures-${{ hashFiles('content/posts/**', 'scripts/render-figures.py', 'src/mathjax.js.gz', 'templates/js/chart-theme.js', 'static/vendor/**') }}
          restore-keys: figures-

      - name: Test
        run: go test ./...

      - name: Build
        run: go run ./src

      - name: Publish to main
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main
          publish_dir: ./public
          force_orphan: true
