html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
/* Moving between pages: the old content fades out where it was (base.js renames it main-old, so it
   doesn't jump to where the new content sits) while the rules slide to their new places, and the new
   content fades in behind them. The rest of the page (header, frame, footer) fades out over the new
   one with normal blending: the default additive cross-fade flashes the whole background on any frame
   where the two opacities don't sum to one. A language switch fades both at once. */
@media(prefers-reduced-motion:no-preference){@view-transition{navigation:auto}}
main{view-transition-name:main}
.rule{view-transition-class:rule}
::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1;mix-blend-mode:normal;animation:fade .2s ease-in both reverse}
::view-transition-group(main){animation:none}
::view-transition-group(*.rule){animation-duration:.4s;animation-timing-function:cubic-bezier(.4,0,.2,1)}
::view-transition-old(main),::view-transition-old(main-old){animation:fade .2s ease-in both reverse}
::view-transition-new(main){animation:fade .3s ease-out .12s both}
:root:active-view-transition-type(swap)::view-transition-new(main){animation-delay:0s}
@keyframes fade{from{opacity:0}}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
body{margin:0;overflow-x:clip;background:var(--paper)}
a{color:inherit;text-decoration:none}
a:hover{color:var(--green)}
a:focus-visible{outline:2px solid var(--green);outline-offset:5px}
::selection{background:var(--sel)}
.shell{max-width:1120px;margin:48px auto;position:relative;min-height:calc(100vh - 96px);border-inline:1px solid var(--line);display:flex;flex-direction:column}
.eyebrow{font-size:11px;line-height:1.8;letter-spacing:1.7px;color:var(--green);display:flex;align-items:center;gap:8px}
h1,.post-summary h2,.prose h2,.prose h3,.post-pagination a{font-family:var(--serif);font-weight:400}
.writing{padding:0}
.site-header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px 48px 20px;position:relative;font-size:13px;line-height:1.6}
.brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--serif);font-size:17px;letter-spacing:-.2px}
.brand img{width:24px;height:24px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.site-header nav{display:flex;align-items:center;gap:24px;color:var(--muted);font-family:var(--mono);font-size:12px}
.site-header nav span{margin-left:3px;font-size:11px}
.site-header nav [aria-current]{color:var(--ink);text-decoration:underline;text-decoration-color:var(--green);text-underline-offset:5px;text-decoration-thickness:1px}
.theme{display:inline-flex;padding:4px;margin:-4px;border:0;background:none;cursor:pointer}
.theme:hover{color:var(--green)}
:root[data-theme=dark] .theme svg{transform:rotate(180deg)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .theme svg{transform:rotate(180deg)}}
.page-head{position:relative;padding:56px 48px 48px}
.ledger{display:grid;grid-template-columns:160px 1fr;gap:32px;padding:38px 48px 34px;position:relative}
.ledger-meta{display:flex;flex-direction:column;gap:6px;padding-right:24px;font-family:var(--mono);font-size:11px;line-height:1.65;color:var(--muted)}
.ledger-label{color:var(--green);letter-spacing:.06em;text-transform:uppercase}
.ledger-body{min-width:0}
.ledger-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 28px;margin:0}
.ledger-kpis>div{display:flex;flex-direction:column;gap:4px}
.ledger-kpis dt{font-size:12px;line-height:1.5;color:var(--muted)}
.ledger-kpis dd{margin:0;font-family:var(--mono);font-size:24px;font-weight:500;line-height:1.25;letter-spacing:-.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.ledger-kpis .kpi-u{font-size:14px}
.ledger-kpis dd a:hover .kpi-u{color:var(--green)}
.ledger-cats{margin-top:20px;padding-top:16px;border-top:1px solid color-mix(in srgb,var(--line) 72%,transparent)}
.cat-bar{display:flex;gap:3px;height:4px;margin-bottom:12px;overflow:hidden}
.cat-bar i{min-width:6px;border-radius:1px}
.cat-bar .c0,.cat-list .c0{background:var(--green)}
.cat-bar .c1,.cat-list .c1{background:var(--sky)}
.cat-bar .c2,.cat-list .c2{background:var(--clay)}
.cat-bar .c3,.cat-list .c3{background:var(--kraft)}
.cat-bar .c4,.cat-list .c4{background:var(--stone)}
.cat-list{display:flex;flex-wrap:wrap;gap:8px 22px;list-style:none;margin:0;padding:0;font-size:13px;line-height:1.6}
.cat-list a{display:inline-flex;align-items:center;gap:7px;color:var(--body)}
.cat-list a:hover{color:var(--green)}
.cat-list i{width:6px;height:6px;border-radius:1px;flex:none}

.key{display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted)}
.key i{display:inline-block;width:10px;height:2px;margin-right:6px;vertical-align:middle}
.key i.sq{width:8px;height:8px}
.plot{position:relative;margin:14px 20px 6px}
.plot svg{display:block;width:100%;height:auto;aspect-ratio:664/var(--h);overflow:visible}
.plot span{position:absolute;font-family:var(--mono);font-size:10px;line-height:1;color:var(--muted);white-space:nowrap}
.plot .yl{text-align:right;transform:translate(calc(-100% - 6px),-50%)}
.plot .xl{transform:translateX(-50%)}
.plot .dl{font-size:10.5px;font-weight:500}
.plot .tip{position:absolute;top:0;bottom:16px;width:0;pointer-events:none;z-index:2}
.tip>i{position:absolute;inset:0 auto 0 0;border-left:1px dashed var(--muted)}
.tip>div{position:absolute;top:4px;left:8px;padding:6px 10px;border:1px solid var(--line);background:var(--card);box-shadow:0 4px 14px rgb(0 0 0/.08);font-family:var(--mono);font-size:11px;line-height:1.7;color:var(--ink);white-space:nowrap}
.tip.flip>div{left:auto;right:8px}
.tip b{display:block;font-weight:400;color:var(--muted)}
.plot .tip span{position:static;display:flex;align-items:center;gap:7px;font-size:11px;line-height:1.7;color:var(--ink)}
.tip span i{width:8px;height:2px}
.tip em{font-style:normal}
/* ```echarts and ```mermaid figures (src/figures.go): open on the page, a numbered label over the title, the note under a rule. */
:is(.echart,.diagram,.plotfig,.video,.frames,.cases,.trace,.widget){margin:2.6em 0;counter-increment:figure}
:is(.echart,.diagram,.plotfig,.video,.frames,.cases,.trace,.widget) figcaption{margin:0 0 16px;font-family:var(--serif);font-size:15px;font-weight:600;line-height:1.6;color:var(--ink)}
:is(.echart,.diagram,.plotfig,.video,.frames,.cases,.trace,.widget) figcaption::before{content:"FIGURE " counter(figure);display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:.1em;color:var(--clay-ink)}
/* Inline drawings are heavy to lay out and paint: skip them until they come near, so the first screen paints as fast as a page without them. */
.figure-plot{position:relative;content-visibility:auto;contain-intrinsic-size:auto 480px}
.echart .figure-plot{height:var(--h);contain-intrinsic-size:auto var(--h);font-family:var(--mono)}
.echart .figure-plot>svg{display:block;width:100%;height:100%}
.echart.wait .figure-plot{visibility:hidden}
@media print{.echart.wait .figure-plot{visibility:visible}}
.diagram .figure-plot{overflow-x:auto;padding:4px 0;contain-intrinsic-size:auto calc(var(--h,472px) + 8px)}
.diagram .figure-plot>svg{display:block;height:auto;margin:auto}
/* ```sketch drawings (src/sketch.go): warm panels, outlined nodes, tags colored by role, thin edges with open arrowheads. */
.sketch{display:block;width:100%;height:auto;margin:auto;font-family:var(--sans);font-size:13px}
/* A sketch may carry a phone layout as a second drawing; one of the two shows. */
.figure-plot>svg.sketch.narrow{display:none}
@media(max-width:640px){.figure-plot>svg.sketch.wide{display:none}.figure-plot>svg.sketch.narrow{display:block}.diagram .figure-plot{contain-intrinsic-size:auto calc(var(--hn,var(--h,472px)) + 8px)}}
.sketch text{fill:var(--ink);dominant-baseline:central}
.sketch .b{font-weight:500}
.sketch .mono{font-family:var(--mono);font-size:11.5px}
.sketch .small{font-size:11px;fill:var(--muted)}
.sketch .caps{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.sketch .mid{text-anchor:middle}
.sketch .end{text-anchor:end}
.sketch .panel{fill:var(--panel);stroke:none}
.sketch .window{fill:none;stroke:var(--node-line);stroke-width:1.25;stroke-dasharray:4 3}
.sketch .node>:is(rect,path,circle,ellipse,polygon){fill:var(--node);stroke:var(--node-line);stroke-width:1.25}
.sketch .node.plain>:is(rect,path,circle,ellipse,polygon){fill:var(--card)}
.sketch .node.blue>:is(rect,path,circle,ellipse,polygon){fill:var(--blue-wash);stroke:var(--blue)}
.sketch .node.teal>:is(rect,path,circle,ellipse,polygon){fill:var(--teal-wash);stroke:var(--teal)}
.sketch .node.orange>:is(rect,path,circle,ellipse,polygon){fill:var(--orange-wash);stroke:var(--orange)}
.sketch .node.violet>:is(rect,path,circle,ellipse,polygon){fill:var(--violet-wash);stroke:var(--violet)}
.sketch .node.clay>:is(rect,path,circle,ellipse,polygon){fill:var(--clay-wash);stroke:var(--clay)}
.sketch .node.blue>text{fill:var(--blue-ink)}
.sketch .node.teal>text{fill:var(--teal-ink)}
.sketch .node.orange>text{fill:var(--orange-ink)}
.sketch .node.violet>text{fill:var(--violet-ink)}
.sketch .node.clay>text{fill:var(--clay-ink)}
.sketch .edge{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
.sketch .edge.dash{stroke-dasharray:3 4}
.sketch .edge.hot{stroke:var(--clay)}
.sketch .arrowhead path{fill:none;stroke:var(--edge);stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
.sketch .glyph{fill:var(--card);stroke:var(--node-line);stroke-width:1}
.sketch .ink{fill:var(--ink)}
.sketch .mute{fill:var(--muted)}
.sketch .accent{fill:var(--clay)}
.sketch-tex{color:var(--ink)}
.sketch-tex.small,.sketch-tex.mute{color:var(--muted)}
.sketch-tex.ink{color:var(--ink)}
.sketch-tex.accent{color:var(--clay)}
.sketch-tex.clay,.sketch .node.clay>.sketch-tex{color:var(--clay-ink)}
.sketch-tex.blue,.sketch .node.blue>.sketch-tex{color:var(--blue-ink)}
.sketch-tex.teal,.sketch .node.teal>.sketch-tex{color:var(--teal-ink)}
.sketch-tex.orange,.sketch .node.orange>.sketch-tex{color:var(--orange-ink)}
.sketch-tex.violet,.sketch .node.violet>.sketch-tex{color:var(--violet-ink)}
.video video{display:block;width:100%;height:auto;border-radius:8px;background:var(--wash)}
.plot-legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 14px;padding:0;list-style:none;font-size:12.5px;line-height:1.55;color:var(--body)}
.plot-legend li{position:relative;padding-left:23px;min-width:0;max-width:100%;overflow-wrap:anywhere}
.plot-legend li::before{content:"";position:absolute;left:0;top:.75em;transform:translateY(-50%);width:16px;height:2px;background:var(--c)}
.plot-legend .dot{padding-left:15px}
.plot-legend .dot::before{width:8px;height:8px;border-radius:50%}
.plot-legend .dash::before{background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 8px)}
.plot-legend .band::before{height:10px;background:color-mix(in srgb,var(--c) 34%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 58%,transparent)}
.plot-legend .ramp{padding-left:47px}
.plot-legend .ramp::before{width:40px;height:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 20%,transparent),var(--c))}
.plot-grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:20px 24px;content-visibility:auto;contain-intrinsic-size:auto 280px}
.plot-title{margin:0 0 4px;font-size:13px;font-weight:500;line-height:1.4;color:var(--ink)}
.plot-panel svg{display:block;width:100%;height:auto;overflow:visible;font-family:var(--sans);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.plot-panel svg text{fill:currentColor}
.plot-title .math-svg{display:inline-block;color:inherit;font-size:inherit}
.plot-panel svg .grid{color:var(--grid);stroke-opacity:1}
.plot-panel{position:relative}
.plot-panel .phone{display:none}
.plot-panel svg .on{stroke:var(--ink)!important;stroke-width:2px!important}
.plot-xlabel{margin:10px 0 0;text-align:center;font-size:12px;color:var(--muted)}
@media(max-width:640px){.plot-grid{grid-template-columns:repeat(var(--ncols),minmax(0,1fr));gap:18px 16px}.plot-panel .wide{display:none}.plot-panel .phone{display:block}}
.plot-tip{position:absolute;z-index:3;pointer-events:none;padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);box-shadow:0 2px 10px rgb(0 0 0/.08);font-size:12px;line-height:1.5;white-space:pre;color:var(--ink);font-variant-numeric:tabular-nums}
.figure-note{margin:14px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;line-height:1.8;color:var(--muted)}
/* ```widget figures (src/widget.go, templates/js/widget.js): a still picture until the post's own module has drawn the live figure in its place. */
.widget-stage{position:relative}
.widget-still{display:block;width:100%;height:auto;border-radius:10px}
.widget:not(.live) .widget-live{position:absolute;inset:0;visibility:hidden;overflow:hidden}
.widget.live :is(picture,.widget-still,.widget-hint){display:none}
.widget-hint{margin:6px 0 0;font-size:12px;line-height:1.6;color:var(--muted)}
/* ```frames strips (src/frames.go): pictures in a row, the model's box placed over each in percent, P(present) as a number and a bar. Frames under the threshold fade. */
.frames .frames-q{margin:-6px 0 12px;font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--muted)}
.prose .frames-strip{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:12px 10px;margin:0;padding:0;list-style:none}
.prose .frames-strip>li{min-width:0;margin:0}
.shot{position:relative;overflow:hidden;background:var(--wash);line-height:0}
.prose .shot img{width:100%;border:0}
.frames .out .shot img{opacity:.5;filter:grayscale(1)}
.shot .box{position:absolute;border:2px solid var(--clay);box-shadow:0 0 0 1px var(--paper)}
.frames .frames-p{display:flex;justify-content:space-between;gap:6px;margin:6px 0 0;font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--muted)}
.frames-p b{font-weight:400;color:var(--muted);white-space:nowrap}
.frames .in .frames-p b{color:var(--clay-ink)}
.frames-bar{display:block;height:3px;margin-top:4px;background:linear-gradient(90deg,var(--stone) var(--p),var(--line) 0)}
.frames .in .frames-bar{background:linear-gradient(90deg,var(--clay) var(--p),var(--line) 0)}
.frames .frames-cap{margin:4px 0 0;font-size:12px;line-height:1.6;color:var(--body)}
/* ```cases cards (src/cases.go): the question, then the key and each model's answer, green when right and red when wrong. */
.case-list{display:grid;gap:12px}
.case{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:16px 20px;background:var(--card);border:1px solid var(--line)}
.case.with-image{grid-template-columns:112px minmax(0,1fr)}
.prose .case-image img{width:112px;height:112px;object-fit:cover;border:0}
.cases .case-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0 0 6px;font-size:12px;line-height:1.6;color:var(--muted)}
.case-head .key{color:var(--ink)}
.case-tag{margin-left:auto;padding:0 8px;border:1px solid var(--red);border-radius:999px;font-size:11px;font-style:normal;color:var(--red)}
.cases .case-q{margin:0 0 10px;font-size:14px;font-weight:500;line-height:1.75;color:var(--ink)}
.case-rows{display:grid;gap:2px;margin:0;font-size:13px;line-height:1.7}
.case-rows>div{display:grid;grid-template-columns:9.5em minmax(0,1fr);gap:12px}
.case-rows dt{padding-top:1px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.case-rows dd{margin:0;color:var(--body)}
.case-rows i{display:inline-block;width:1.3em;font-style:normal}
.case-rows .ok dd{color:var(--green)}
.case-rows .bad dd{color:var(--red)}
/* ```trace excerpts (src/trace.go): an agent's log in a terminal-like panel; annotated lines are tinted, the note beside them (below on phones). */
.prose .trace-log{margin:0;padding:10px 0;list-style:none;background:var(--wash);border:1px solid var(--line);font-family:var(--mono);font-size:12px;line-height:1.7}
.prose .trace-log>li{display:grid;grid-template-columns:4.2em minmax(0,1fr) minmax(0,12em);gap:0 14px;align-items:start;margin:0;padding:3px 16px}
.prose .trace-log>li:has(>.t-note){background:var(--clay-wash)}
.t-k{color:var(--muted);text-align:right;user-select:none}
.t-x{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--body)}
.t-cmd .t-x{color:var(--ink)}
.t-out .t-x{color:var(--muted)}
.t-user .t-x,.t-say .t-x{font-family:var(--sans);font-size:13px}
.t-ans .t-x{color:var(--green)}
.t-error .t-x{color:var(--red)}
.t-note{padding-left:10px;border-left:2px solid var(--clay);font-family:var(--sans);font-size:12px;line-height:1.65;color:var(--clay-ink)}
.t-x summary,.t-fold summary{cursor:pointer;list-style:none}
.t-x summary::-webkit-details-marker,.t-fold summary::-webkit-details-marker{display:none}
.t-x summary i{font-style:normal;color:var(--muted)}
.t-x summary:hover i,.t-fold summary:hover{color:var(--green)}
.prose .trace-log>li.t-fold{display:block;padding:2px 0}
.t-fold summary{padding:0 16px 0 calc(4.2em + 30px);color:var(--muted)}
.t-fold summary::before{content:"⋯ ";color:var(--faint)}
.t-fold details[open]>summary::before{content:"▾ "}
.prose .t-fold .trace-log{padding:2px 0 0;border:0;background:none}
.prose .stats-group,.stats-group{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin:0;padding:14px 0 4px;font-family:var(--sans);font-size:12px;line-height:1.5;color:var(--muted)}
.stats .kpi+.stats-group{margin-top:4px;padding-top:16px;border-top:1px solid color-mix(in srgb,var(--line) 75%,transparent)}
.stats-group b{font-weight:500;color:var(--ink)}
.kpi{display:grid;grid-template-columns:repeat(var(--k,4),minmax(0,1fr));column-gap:28px;margin:0}
.kpi>div{grid-row:span 3;display:grid;grid-template-rows:subgrid;row-gap:3px;padding:10px 0 14px}
.kpi>div.r2{padding-top:14px;border-top:1px solid color-mix(in srgb,var(--line) 65%,transparent)}
.kpi dt{align-self:end;font-size:12px;line-height:1.5;color:var(--muted)}
.kpi dd{margin:0;align-self:baseline;font-family:var(--mono);font-size:22px;font-weight:500;line-height:1.25;letter-spacing:-.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi-u{font-family:var(--sans);font-size:12.5px;font-weight:400;letter-spacing:0;color:var(--muted)}
.kpi dd.up{color:var(--green)}
.kpi dd.s{align-self:start;font-family:var(--sans);font-size:11.5px;font-weight:400;line-height:1.55;letter-spacing:0;color:var(--muted)}
.ticker{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;color:var(--ink)}
.ticker>span:first-child{display:flex;flex-direction:column;gap:4px;min-width:0}
.ticker b{font-family:var(--mono);font-size:15px;font-weight:500;overflow-wrap:anywhere}
.ticker-label{font-size:12px;line-height:1.6;color:var(--muted)}
.ticker-go{display:flex;align-items:baseline;gap:18px;font-family:var(--mono);font-size:12px;white-space:nowrap}
.ticker-go button{padding:0;border:0;background:none;color:var(--green);cursor:pointer}
.ticker-go button:hover{color:var(--ink)}
.prose .ticker-go a{color:var(--muted);text-decoration:none}
.prose .ticker-go a:hover{color:var(--green)}
.tv{margin:-2.2em 0 2.2em;border:1px solid var(--line);border-top:0;background:var(--card)}
.tv>div{height:100%}
/* # Cards (src/cards.go): collapsed Anki review deck at the foot of a post. */
.cards-deck,.prose>.cards-deck{margin:2.6em 0 0;border:1px solid var(--line);background:var(--card);scroll-margin-top:32px;content-visibility:visible;contain-intrinsic-size:none}
.cards-summary{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:18px 22px;cursor:pointer;list-style:none;user-select:none}
.cards-summary::-webkit-details-marker{display:none}
.cards-summary:hover .cards-title{color:var(--green)}
.cards-head{display:flex;flex-direction:column;gap:2px;min-width:0}
.cards-title{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.45;color:var(--ink)}
.cards-meta{display:inline-flex;align-items:center;gap:10px;color:var(--muted)}
.cards-caret{display:inline-block;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .16s ease}
.cards-deck[open]>.cards-summary{border-bottom:1px solid var(--line);background:var(--wash)}
.cards-deck[open] .cards-caret{transform:rotate(45deg)}
.cards-body{padding:16px 22px 22px}
.cards-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px 18px;margin:0 0 14px;font-family:var(--mono);font-size:12px}
.cards-list{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.anki-card{min-width:0;padding:18px 20px;border:1px solid var(--line);background:var(--paper);font-size:14.5px;line-height:1.85}
.prose .cards-deck p>strong{padding-bottom:0;background:none;animation:none;color:var(--ink)}
.anki-head{display:flex;flex-direction:column;gap:4px;margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid color-mix(in srgb,var(--line) 72%,transparent)}
.anki-head>.key{font-size:11px;letter-spacing:.04em;color:var(--green)}
.prose .anki-title{margin:0;font-size:15.5px;font-weight:500;line-height:1.55;color:var(--ink)}
.prose .anki-sub{margin:.8em 0 .35em;color:var(--ink)}
.anki-front>:first-child,.anki-back-body>:first-child,.anki-extra>:nth-child(2){margin-top:0}
.anki-front>:last-child,.anki-back-body>:last-child,.anki-extra>:last-child{margin-bottom:0}
.anki-card :is(p,ul,ol){margin:0 0 .85em}
.anki-card .code{margin:.9em 0}
.cloze{display:inline;padding:1px 7px;margin:0 1px;border:1px dashed var(--green);border-radius:3px;background:var(--wash);color:var(--ink);cursor:pointer;vertical-align:baseline;text-align:left;line-height:inherit}
.cloze:hover{background:var(--sel)}
.cloze:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.cloze-mask{font-family:var(--mono);font-size:.84em;font-weight:400;color:var(--green)}
.cloze-ans{display:none}
.cloze[aria-expanded=true]{border-style:solid;border-color:color-mix(in srgb,var(--green) 55%,var(--line));background:color-mix(in srgb,var(--sel) 65%,transparent)}
.cloze[aria-expanded=true]>.cloze-mask{display:none}
.cloze[aria-expanded=true]>.cloze-ans{display:inline}
.cloze-block{margin:.9em 0;text-align:center}
.cloze-math{display:inline-block;padding:3px 8px;vertical-align:middle}
.cloze-block>.cloze-math{max-width:100%;overflow-x:auto}
.cloze-block .math{margin:0}
.anki-extra{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--muted)}
.anki-card.is-solved>.anki-extra{display:block}
.prose .anki-label{margin:0 0 6px;font-size:11px;color:var(--muted)}
.anki-back{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.anki-back>summary{display:inline-flex;align-items:center;gap:6px;cursor:pointer;list-style:none;color:var(--green)}
.anki-back>summary::-webkit-details-marker{display:none}
.anki-back>summary::before{content:"▸";font-size:11px}
.anki-back[open]>summary::before{content:"▾"}
.anki-back>summary:hover{color:var(--ink)}
.anki-back-body{margin-top:10px;padding:12px 14px;border-left:2px solid var(--green);background:var(--wash)}
.prose .anki-tags{margin:12px 0 0;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--line) 65%,transparent)}
.anki-tags span{padding:1px 7px;border:1px solid var(--line);color:var(--muted)}
.prose hr{border:0;border-top:1px solid var(--line);margin:35px 0}
.empty{padding:48px;color:var(--muted)}
.skip{position:absolute;top:-80px;left:15px;background:var(--paper);padding:12px;z-index:2}
.skip:focus{top:12px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.post-article{max-width:none;padding:0}
.post-article>.article-header{max-width:none;position:relative;margin:0;padding:44px 48px 48px;border:0}
.article-body{display:grid;grid-template-columns:minmax(0,704px) minmax(160px,1fr);column-gap:56px;align-items:start;padding:44px 48px 56px}
.article-body>.prose{grid-column:1;grid-row:1;min-width:0}
.toc{grid-column:2;grid-row:1;position:sticky;top:32px;max-height:calc(100vh - 64px);overflow:auto}
.toc,.toc-mobile{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.7}
.toc>p,.toc-mobile summary{margin:0 0 16px;color:var(--ink)}
